<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora</title>
<style>
  :root {
    --bg: #e9ecef;
    --body: #1f2a37;
    --screen: #cfe3d4;
    --screen-text: #14301f;
    --key: #f8f9fa;
    --key-text: #1f2a37;
    --op: #3b6ea5;
    --op-text: #ffffff;
    --clear: #c0504d;
    --eq: #2f855a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --body: #262f3a; --key: #36414f; --key-text: #f1f3f5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    padding: 16px;
  }
  .calc {
    width: 100%;
    max-width: 340px;
    background: var(--body);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .screen {
    background: var(--screen);
    color: var(--screen-text);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history { font-size: 14px; opacity: .65; min-height: 20px; word-break: break-all; }
  .current { font-size: 38px; font-weight: 700; word-break: break-all; line-height: 1.15; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    font: inherit;
    font-size: 22px;
    font-weight: 600;
    height: 58px;
    border: 0;
    border-radius: 12px;
    background: var(--key);
    color: var(--key-text);
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  button:hover { filter: brightness(.95); }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid #f6c453; outline-offset: 2px; }
  .op { background: var(--op); color: var(--op-text); }
  .clear { background: var(--clear); color: #fff; }
  .eq { background: var(--eq); color: #fff; grid-row: span 2; height: auto; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="current" id="current" aria-live="polite">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button class="op" data-action="back" aria-label="Borrar">⌫</button>
      <button class="op" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="dot">,</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </main>

<script>
  let current = "0";      // número que se está escribiendo
  let previous = null;    // número anterior
  let operator = null;    // operación pendiente
  let justEvaluated = false;

  const currentEl = document.getElementById("current");
  const historyEl = document.getElementById("history");
  const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  function format(text) {
    return String(text).replace(".", ",");
  }

  function render() {
    currentEl.textContent = format(current);
    historyEl.textContent = operator ? format(previous) + " " + symbols[operator] : "";
  }

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    if (op === "+") r = a + b;
    else if (op === "-") r = a - b;
    else if (op === "*") r = a * b;
    else if (op === "/") {
      if (b === 0) return "Error";
      r = a / b;
    }
    return String(parseFloat(r.toPrecision(12)));
  }

  function inputNumber(n) {
    if (current === "Error" || justEvaluated) { current = "0"; justEvaluated = false; }
    if (current.replace(/[-.]/g, "").length >= 14) return;
    current = current === "0" ? n : current + n;
    render();
  }

  function inputDot() {
    if (current === "Error" || justEvaluated) { current = "0"; justEvaluated = false; }
    if (!current.includes(".")) current += ".";
    render();
  }

  function chooseOperator(op) {
    if (current === "Error") return;
    if (operator && !justEvaluated && previous !== null) {
      previous = compute(previous, current, operator);
    } else {
      previous = current;
    }
    operator = op;
    current = previous === "Error" ? "Error" : "0";
    if (previous === "Error") { operator = null; previous = null; }
    justEvaluated = false;
    render();
  }

  function equals() {
    if (!operator || previous === null) return;
    const result = compute(previous, current, operator);
    historyEl.textContent = format(previous) + " " + symbols[operator] + " " + format(current) + " =";
    current = result;
    operator = null;
    previous = null;
    justEvaluated = true;
    currentEl.textContent = format(current);
  }

  function clearAll() {
    current = "0"; previous = null; operator = null; justEvaluated = false;
    render();
  }

  function backspace() {
    if (justEvaluated || current === "Error") { clearAll(); return; }
    current = current.length > 1 ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    render();
  }

  function percent() {
    if (current === "Error") return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    render();
  }

  document.querySelector(".keys").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.num !== undefined) inputNumber(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else if (b.dataset.action === "equals") equals();
    else if (b.dataset.action === "clear") clearAll();
    else if (b.dataset.action === "back") backspace();
    else if (b.dataset.action === "dot") inputDot();
    else if (b.dataset.action === "percent") percent();
  });

  // Soporte de teclado
  document.addEventListener("keydown", (e) => {
    if (e.key >= "0" && e.key <= "9") inputNumber(e.key);
    else if (e.key === "." || e.key === ",") inputDot();
    else if ("+-*/".includes(e.key)) chooseOperator(e.key);
    else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); equals(); }
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Escape") clearAll();
    else if (e.key === "%") percent();
  });

  render();
</script>
</body>
</html>
