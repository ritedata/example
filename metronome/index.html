<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8913a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metronome">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Metronome</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#15171d;--mu:#6b7280;--ac:#e8913a;--bd:#d9dce3;--ac2:#3b82f6;--off:#e6e8ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171d;--card:#1f222b;--tx:#f1f2f5;--mu:#9aa0ad;--bd:#2d313c;--off:#2a2e39}}
:root[data-theme="dark"]{--bg:#15171d;--card:#1f222b;--tx:#f1f2f5;--mu:#9aa0ad;--bd:#2d313c;--off:#2a2e39}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;height:100%;overflow-y:auto;padding:8px 14px 10px;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,16px)}
h1{font-size:15px;margin:0;text-align:center}
.hint{color:var(--mu);font-size:11px;text-align:center;margin:0}
.beats{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;flex:0 0 auto;min-height:76px}
.beat{width:38px;height:clamp(70px,13vh,120px);border-radius:12px;border:2px solid var(--bd);background:var(--off);cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.beat i{display:block;width:100%;background:var(--ac2);height:55%}
.beat.a i{background:var(--ac);height:100%}
.beat.l i{height:30%;background:#8b5cf6}
.beat.m i{height:6%;background:var(--mu)}
.beats.rtl{flex-direction:row-reverse}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.vol input{flex:1;min-width:0}
.vol span{color:var(--mu);font-size:13px}
.vol #volv{min-width:38px;text-align:right}
#saveSong{padding:6px 16px;font-size:13px;min-width:0;background:var(--ac);color:#15171d;border:0}
#dir{padding:6px 12px;font-size:13px;align-self:center;min-width:0}
.beat span{position:absolute;top:4px;left:0;right:0;font-size:12px;font-weight:700;color:var(--tx)}
.beat.on{border-color:var(--tx);transform:scale(1.08)}
.bpm{text-align:center}
.bpm output{font-size:clamp(44px,8vh,64px);font-weight:700;line-height:1;display:block}
.bpm small{color:var(--mu);letter-spacing:.1em}
.row{display:flex;gap:8px;justify-content:center;align-items:center}
button{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 0;min-width:48px;cursor:pointer;font-weight:600}
button:active{transform:scale(.96)}
input[type=range]{width:100%;accent-color:var(--ac)}
[hidden]{display:none!important}
.songs{position:relative;display:flex;gap:8px}
.songs input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.songs button{min-width:44px}
.songs ul{position:absolute;top:100%;left:0;right:0;z-index:5;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-height:40vh;overflow:auto;display:none}
.songs ul.open{display:block}
.songs li{padding:10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.songs li small{color:var(--mu);white-space:nowrap}
.songs li:hover{background:var(--off)}
#editor{display:flex;flex-direction:column;gap:8px}
#editor textarea{width:100%;height:120px;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:13px/1.4 system-ui,sans-serif;resize:vertical}
#editor small{color:var(--mu);font-size:11px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.presets button{padding:8px 0;min-width:0}
.presets button.s{background:var(--ac2);border-color:var(--ac2);color:#fff}
.tabs{display:grid;grid-template-columns:1fr;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--bd)}
.tabs button{border:0;background:none;padding:8px 0;border-radius:9px;color:var(--mu)}
.tabs button.s{background:var(--ac);color:#15171d}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:6px}
.panel.s{display:flex}
h3{margin:0;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 10px;min-width:0;font-size:13px}
.chips button.s{background:var(--ac2);border-color:var(--ac2);color:#fff}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
label input[type=number]{width:70px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.go{background:var(--ac);color:#15171d;border:0;padding:12px;font-size:18px;border-radius:14px}
.go.run{background:#ef4444;color:#fff}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
</style></head>
<body><main>
<h1>Metronome</h1>
<div class="songs"><input id="q" placeholder="Type a song name or pick one…" autocomplete="off" aria-label="Song"><button id="edit" aria-label="Edit song list">✎</button><ul id="list"></ul></div>
<div id="editor" hidden><textarea id="ta" spellcheck="false"></textarea><small>One song per line: Title — 3/4 — 120 BPM — A N N — LTR (A = high, N = normal, L = low, M = mute; LTR / RTL = direction), or JSON with {title, timeSignature, bpm, beatPattern, direction}</small><button id="save">Save list</button></div>
<div class="beats" id="beats"></div>
<p class="hint">Tap a beat to cycle: high → normal → low → mute</p>
<div class="row"><button id="dir" aria-label="Beat direction"></button><button id="saveSong" aria-label="Save settings for this song">Save</button></div>
<div class="bpm"><output id="bpm">80</output><small>BPM · <span id="tempoName">Andante</span></small></div>
<input type="range" id="slider" min="30" max="500" value="80" aria-label="Tempo">
<div class="row">
<button data-d="-5">−5</button><button data-d="-1">−</button><button data-d="1">+</button><button data-d="5">+5</button>

</div>
<div class="presets" id="presets"><button data-bpm="160">160</button><button data-bpm="240">240</button><button data-bpm="320">320</button><button data-bpm="400">400</button></div>


<section class="panel s" id="p-r">
<h3>Time signature</h3><div class="chips" id="sig"></div>

</section>
<button class="go" id="go">Start</button>
<label class="vol" for="vol"><span>Volume</span><input type="range" id="vol" min="0" max="100" value="80"><span id="volv">80%</span></label>
</main>
<div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
let bpm=80,num=4,sub=1,tim='click',pat=[],running=false,ac,next=0,step=0,timer,bar=0,taps=[];
const sigs=[[2,'2/4'],[3,'3/4'],[4,'4/4'],[5,'5/4'],[6,'6/8'],[7,'7/4']];
const subs=[[1,'Quarters'],[2,'Eighths'],[3,'Triplets'],[4,'Sixteenths']];
const tims=[['click','Click'],['wood','Wood'],['beep','Beep'],['drum','Drum']];
const names=[[40,'Largo'],[66,'Adagio'],[76,'Andante'],[108,'Moderato'],[120,'Allegro'],[168,'Vivace'],[500,'Presto']];
function chips(el,list,get,set){el.innerHTML='';list.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;if(get()==v)b.className='s';b.onclick=()=>{set(v);chips(el,list,get,set)};el.append(b)})}
function setBpm(v){bpm=Math.max(30,Math.min(500,Math.round(v)));document.querySelectorAll('[data-bpm]').forEach(b=>b.classList.toggle('s',+b.dataset.bpm==bpm));$('bpm').textContent=bpm;$('slider').value=bpm;$('tempoName').textContent=(names.find(n=>bpm<=n[0])||names[6])[1]}
function buildBeats(){const old=pat;pat=Array.from({length:num},(_,i)=>old[i]||(i==0?'a':'n'));if(!old.length||old.length!=num)pat=pat.map((p,i)=>i==0?'a':p);
$('beats').innerHTML='';pat.forEach((p,i)=>{const b=document.createElement('button');b.className='beat '+p;b.innerHTML='<i></i><span>'+(i+1)+'</span>';b.setAttribute('aria-label','Beat '+(i+1));b.onclick=()=>{pat[i]={a:'n',n:'l',l:'m',m:'a'}[pat[i]];b.classList.remove('a','n','l','m');b.classList.add(pat[i])};$('beats').append(b)})}
function click(t,kind){ // kind: a,n,s(sub)
const o=ac.createOscillator(),g=ac.createGain(),v=$('vol').value/100;
let f={click:[2200,1000,500],wood:[900,650,500],beep:[1200,880,660],drum:[200,130,100]}[tim];
const fr=kind=='a'?f[0]:kind=='n'?f[1]:f[2],a=(kind=='a'?1:.45)*v;
o.type=tim=='beep'?'sine':tim=='drum'?'triangle':'square';o.frequency.setValueAtTime(fr,t);
if(tim=='drum')o.frequency.exponentialRampToValueAtTime(fr*.4,t+.12);
g.gain.setValueAtTime(a*(tim=='click'?.5:.8),t);g.gain.exponentialRampToValueAtTime(.0001,t+(tim=='drum'?.15:.06));
o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.18)}
function flash(i,t){setTimeout(()=>{document.querySelectorAll('.beat').forEach((b,j)=>b.classList.toggle('on',j==i))},Math.max(0,(t-ac.currentTime)*1000))}
function barSilent(){return false}
function sched(){while(next<ac.currentTime+.12){const beat=Math.floor(step/sub)%num,s=step%sub;
if(s==0&&beat==0&&step>0)bar++;
const mute=barSilent();
if(s==0){flash(beat,next);if(pat[beat]!='m'&&!mute)click(next,pat[beat])}else if(!mute&&pat[beat]!='m')click(next,'s');
next+=60/bpm/sub;step++}}
function start(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();step=0;bar=0;next=ac.currentTime+.06;timer=setInterval(sched,25);running=true;$('go').textContent='Stop';$('go').classList.add('run')}
function stop(){clearInterval(timer);running=false;$('go').textContent='Start';$('go').classList.remove('run');document.querySelectorAll('.beat').forEach(b=>b.classList.remove('on'))}
$('go').onclick=()=>running?stop():start();
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setBpm(bpm+ +b.dataset.d));
$('slider').oninput=e=>setBpm(+e.target.value);
document.querySelectorAll('[data-bpm]').forEach(b=>b.onclick=()=>setBpm(+b.dataset.bpm));


function drawSig(){chips($('sig'),sigs,()=>num,v=>{num=v;buildBeats();if(running){step=0}})}drawSig();


document.addEventListener('keydown',e=>{if(e.code=='Space'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();$('go').click()}});
buildBeats();setBpm(80);
/* ---- Songs: edit this array, or use the ✎ button to paste a new list ---- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let songs=[{title:'Romance Anónimo',timeSignature:'3/4',bpm:140,beatPattern:['accent','normal','normal'],direction:'left-to-right'},{title:'Capricho Árabe',timeSignature:'3/4',bpm:60,beatPattern:['accent','normal','normal'],direction:'left-to-right'},{title:'Concierto de Aranjuez',timeSignature:'4/4',bpm:50,beatPattern:['accent','normal','normal','normal'],direction:'left-to-right'},{title:'Recuerdos de la Alhambra',timeSignature:'3/4',bpm:220,beatPattern:['accent','normal','normal'],direction:'left-to-right'},{title:'Asturias',timeSignature:'3/4',bpm:120,beatPattern:['accent','normal','normal'],direction:'left-to-right'},{title:'Cavatina',timeSignature:'3/4',bpm:60,beatPattern:['accent','normal','normal'],direction:'left-to-right'}];
try{const s=JSON.parse(localStorage.getItem('songs_v2'));if(Array.isArray(s)&&s.length)songs=s}catch(e){}
function sortSongs(){songs.sort((a,b)=>String(a.title).localeCompare(String(b.title),'es',{sensitivity:'base',numeric:true}))}sortSongs();
function drawList(f){const l=$('list');l.innerHTML='';const q=norm(f||'');songs.filter(s=>norm(s.title).includes(q)).forEach(s=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('small');a.textContent=s.title;b.textContent=s.timeSignature+' · '+s.bpm+' BPM';li.append(a,b);li.onclick=()=>pick(s);l.append(li)});if(!l.children.length){const li=document.createElement('li');li.textContent='No match — tap Save to add it as a new song';l.append(li)}l.classList.add('open')}
function pick(s){cur=songs.indexOf(s);$('q').value=s.title;$('q').blur();$('list').classList.remove('open');num=Math.max(1,Math.min(12,parseInt(s.timeSignature)||4));pat=Array.from({length:num},(_,i)=>{const p=String((s.beatPattern&&s.beatPattern[i])||'').toLowerCase();return p[0]=='a'?'a':p[0]=='n'?'n':p[0]=='l'?'l':p[0]=='m'?'m':(i==0?'a':'n')});buildBeats();drawSig();setDir(s.direction=='right-to-left'?'right-to-left':'left-to-right');setBpm(+s.bpm);if(running)step=0}
function parseSongs(t){t=t.trim();if(t[0]=='['){try{return JSON.parse(t).filter(s=>s&&s.title&&s.bpm).map(s=>({title:String(s.title),timeSignature:String(s.timeSignature||'4/4'),bpm:+s.bpm,beatPattern:Array.isArray(s.beatPattern)?s.beatPattern:undefined,direction:s.direction=='right-to-left'?'right-to-left':'left-to-right'}))}catch(e){return[]}}return t.split('\n').map(L=>L.split(/\s*[—|]\s*|\s+-\s+/)).filter(p=>p.length>=3).map(p=>({title:p[0].trim(),timeSignature:(p[1].match(/\d+\/\d+/)||['4/4'])[0],bpm:parseInt(p[2]),beatPattern:p[3]?(p[3].toLowerCase().match(/accent|normal|low|mute|a|n|l|m/g)||[]).map(x=>({a:'accent',l:'low',m:'mute'}[x[0]]||'normal')):undefined,direction:/^r/i.test((p[4]||'').trim())?'right-to-left':'left-to-right'})).filter(s=>s.title&&s.bpm>0)}
try{const sv=localStorage.getItem('vol');if(sv!==null)$('vol').value=sv}catch(e){}
function showVol(){$('volv').textContent=$('vol').value+'%'}showVol();
$('vol').oninput=()=>{showVol();try{localStorage.setItem('vol',$('vol').value)}catch(e){}};
let cur=-1,dir='left-to-right';
function setDir(d){dir=d;$('beats').classList.toggle('rtl',d=='right-to-left');$('dir').textContent=d=='right-to-left'?'Direction: ← Right to left':'Direction: Left to right →'}
$('dir').onclick=()=>setDir(dir=='right-to-left'?'left-to-right':'right-to-left');
function sigLabel(c){if(c&&parseInt(c.timeSignature)==num)return c.timeSignature;const f=sigs.find(x=>x[0]==num);return f?f[1]:num+'/4'}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
$('saveSong').onclick=()=>{const title=$('q').value.trim();
if(!title){toast('Type a song name or pick one first');return}
const i=songs.findIndex(s=>norm(s.title)==norm(title)),old=i>=0?songs[i]:null;
const data={title:old?old.title:title,timeSignature:sigLabel(old),bpm:bpm,beatPattern:pat.map(x=>({a:'accent',n:'normal',l:'low',m:'mute'}[x]||'normal')),direction:dir};
if(old){songs[i]={...old,...data};cur=i}else{songs.push(data);sortSongs();cur=songs.indexOf(data)}
$('q').value=songs[cur].title;$('list').classList.remove('open');
let ok=true;try{localStorage.setItem('songs_v2',JSON.stringify(songs))}catch(e){ok=false}
toast((old?'Updated settings for "'+songs[cur].title+'"':'Added "'+songs[cur].title+'" to your song list!')+(ok?'':' (this session only)'))};
setDir('left-to-right');
$('q').onfocus=()=>{$('q').select();drawList('')};
$('q').oninput=e=>drawList(e.target.value);
document.addEventListener('click',e=>{if(!e.target.closest('.songs'))$('list').classList.remove('open')});
$('edit').onclick=()=>{const ed=$('editor');ed.hidden=!ed.hidden;if(!ed.hidden)$('ta').value=songs.map(s=>s.title+' — '+s.timeSignature+' — '+s.bpm+' BPM — '+(s.beatPattern||Array.from({length:parseInt(s.timeSignature)||4},(_,i)=>i?'normal':'accent')).map(x=>({accent:'A',low:'L',mute:'M'}[x]||'N')).join(' ')+' — '+(s.direction=='right-to-left'?'RTL':'LTR')).join('\n')};
$('save').onclick=()=>{const p=parseSongs($('ta').value);if(!p.length)return;songs=p;sortSongs();cur=-1;try{localStorage.setItem('songs_v2',JSON.stringify(songs))}catch(e){}$('editor').hidden=true};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
